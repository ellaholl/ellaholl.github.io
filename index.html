<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ella Holl</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mute:#8a8a8f;--pill:#0a0a0a;--pillfg:#fff;--dock:rgba(200,200,208,.55);--dockon:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--fg:#f4f4f5;--mute:#8b8b92;--pill:#f4f4f5;--pillfg:#0b0b0d;--dock:rgba(60,60,68,.6);--dockon:#2a2a30}}
:root[data-theme="dark"]{--bg:#0b0b0d;--fg:#f4f4f5;--mute:#8b8b92;--pill:#f4f4f5;--pillfg:#0b0b0d;--dock:rgba(60,60,68,.6);--dockon:#2a2a30}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;flex-wrap:wrap}
.logo{padding:8px 20px;margin-left:-20px;border-radius:999px;transition:background .2s,color .2s;font-size:22px;font-weight:500;letter-spacing:-.02em}
nav.filters{order:2;display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.filters button{padding:10px 20px;border-radius:999px;color:var(--mute);font-size:18px;transition:background .2s,color .2s}
.filters button:hover{color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--pill);color:var(--pillfg)}
#theme,#mode,#about{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.tools{order:3;display:flex;gap:8px;margin-left:auto}
.logo{order:1}
.logo[aria-pressed="true"]{background:var(--pill);color:var(--pillfg)}
@media (max-width:900px){.tools{order:2}nav.filters{order:3;flex-basis:100%}}
.to-work{display:none}
body[data-mode="personal"] .to-work{display:block}body[data-mode="personal"] .to-personal{display:none}
#about[aria-pressed="true"],#mode:hover,#theme:hover,#about:hover{background:color-mix(in srgb,var(--mute) 18%,transparent)}
main{padding:32px 24px 80px}
.grid{columns:3 320px;column-gap:24px}
.card{break-inside:avoid;margin:0 0 40px;display:block;width:100%;text-align:left}
.art{border-radius:32px;overflow:hidden;position:relative;width:100%}
.card h3{margin:16px 0 4px;font-size:20px;font-weight:500;letter-spacing:-.01em}
.card p{margin:0;color:var(--mute);font-size:16px}
.card.hide{display:none}
.code{font:11px/1.6 ui-monospace,Menlo,monospace;color:#7ee0c3;padding:22px;white-space:pre;overflow:hidden}
.code i{color:#ff9a6c;font-style:normal}.code b{color:#8aa4ff;font-weight:400}
.big{position:absolute;left:24px;bottom:20px;font-size:44px;font-weight:600;letter-spacing:-.04em;color:#fff;line-height:1}
section.info{padding:60px 24px;max-width:720px}
section.info h2{font-size:32px;font-weight:500;letter-spacing:-.02em;margin:0 0 16px}
section.info p{color:var(--mute);font-size:19px;line-height:1.55;margin:0 0 12px}
section.info a{color:var(--fg)}
.sun{display:none}
:root[data-theme="dark"] .sun{display:block}:root[data-theme="dark"] .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sun{display:block}:root:not([data-theme="light"]) .moon{display:none}}
.pop{position:fixed;right:24px;top:calc(72px + env(safe-area-inset-top,0px));width:min(360px,calc(100% - 32px));padding:24px;border-radius:24px;background:var(--bg);border:1px solid color-mix(in srgb,var(--mute) 25%,transparent);box-shadow:0 18px 50px rgba(0,0,0,.18);z-index:6}
.pop[hidden]{display:none}
.pop h4{margin:0 0 10px;font-size:13px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.pop .bio{margin:0 0 24px;font-size:17px;line-height:1.5}
.pop a.mail{display:block;color:var(--fg);text-decoration:none;font-size:18px;margin-bottom:24px}
.pop .socials{margin-top:0}
.socials{display:flex;gap:12px;margin-top:20px}
.socials a{width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--mute) 35%,transparent);display:grid;place-items:center;color:var(--fg)}
.socials a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

@media (max-width:640px){.pop{right:16px}header{padding:16px}main{padding:16px 16px 60px}.filters button{font-size:16px;padding:8px 14px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body data-view="work">
<header>
  <button class="logo" id="home" aria-pressed="true" title="Show everything">Ella Holl</button>
  <nav class="filters" id="filters" aria-label="Filter work">
    
    <button aria-pressed="false" data-f="coding">coding</button>
    <button aria-pressed="false" data-f="research">research</button>
    <button aria-pressed="false" data-f="design">design</button>
    <button aria-pressed="false" data-f="personal">personal</button>
  </nav>
  <div class="tools"><button id="mode" aria-label="Switch to personal work" title="Switch to personal work"><svg class="to-personal" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.8 0-1.2-1-1.6-1-2.7 0-1 .8-1.5 1.8-1.5H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg><svg class="to-work" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M2.5 19h19M9 19l.5-4h5l.5 4"/></svg></button><button id="about" aria-label="About and contact" title="About and contact" aria-pressed="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.7-6 7.5-6s6.7 2 7.5 6"/></svg></button><button id="theme" aria-label="Toggle light or dark mode"><svg class="moon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</header>

<main id="work"><div class="grid" id="grid"></div></main>

<div class="pop" id="pop" role="dialog" aria-label="About and contact" hidden>
  <h4>About me</h4>
  <p class="bio">I'm Ella, a developer, researcher and designer. I build interfaces, run small studies, and make photography and art on the side.</p>
  <h4>Say hi</h4>
  <a class="mail" href="mailto:hello@example.com">hello@example.com</a>
  <h4>Follow me</h4>
  <div class="socials"><a href="#" aria-label="Instagram"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg></a><a href="#" aria-label="LinkedIn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 10v8M6 6.5v.01M11 18v-8M11 13c0-2 1.5-3 3-3s3 1 3 3v5"/></svg></a><a href="#" aria-label="Dribbble"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5 7c5 1 9 0 13-3M3.5 12.5c5-1 10 0 14 6M8.5 3.5c3 3 5 8 6 17"/></svg></a></div>
</div>
<script>
var items=[
 {t:"Paper & Pine Identity",c:"design",tags:"#branding #logo #packaging",h:360,bg:"linear-gradient(160deg,#2f4a3a,#1d3026)",big:"P&P"},
 {t:"Orbit Wayfinding",c:"design",tags:"#signage #systems #typography",h:280,bg:"linear-gradient(120deg,#ffcf3f,#ff9d1f)",big:"→ B4",dark:true},
 {t:"Harbor at Dusk",c:"photography",tags:"#film #coast #long-exposure",h:400,bg:"linear-gradient(180deg,#f6b58a,#c56b7e 45%,#2c3557 75%,#131a33)"},
 {t:"Fog Season",c:"photography",tags:"#landscape #morning #35mm",h:300,bg:"linear-gradient(180deg,#dfe4e6,#aab6ba 60%,#6f7f7c)"},
 {t:"Signal Board",c:"coding",tags:"#react #dashboard #typescript",h:300,bg:"linear-gradient(160deg,#0f1a2b,#16283f)",code:true},
 {t:"Sleep & Screens",c:"research",tags:"#survey #ux-research #sleep",h:380,bg:"radial-gradient(circle at 30% 30%,#ffd6a5,transparent 55%),radial-gradient(circle at 75% 80%,#9bb7ff,transparent 55%),#3a3f7a",big:"n = 412"},
 {t:"Chromatic Dreams",c:"art",tags:"#illustration #digital-art #abstract",h:460,bg:"radial-gradient(circle at 50% 45%,#f4b06a 0 22%,transparent 23%),linear-gradient(180deg,#3a1a6b,#d63a68 70%,#ff6a5a)"},
 {t:"Sourdough Log",c:"personal",tags:"#baking #notes #weekends",h:280,bg:"radial-gradient(ellipse at 50% 60%,#e8c48a 0 35%,transparent 36%),linear-gradient(#f3e6d0,#d9b98a)"},
 {t:"Color Theory",c:"art",tags:"#abstract #digital #experimental",h:250,bg:"radial-gradient(circle at 20% 60%,#ff9a3c,transparent 45%),radial-gradient(circle at 70% 20%,#2a9dff,transparent 50%),radial-gradient(circle at 60% 90%,#ff4fd8,transparent 45%),#ffd27a"},
 {t:"Tiny CLI Toolkit",c:"coding",tags:"#node #cli #open-source",h:340,bg:"linear-gradient(160deg,#101418,#1c2530)",code:true,alt:true},
 {t:"How People Skim Docs",c:"research",tags:"#eye-tracking #reading #study",h:300,bg:"linear-gradient(120deg,#e8f0ff,#c9d9ff)",big:"6 weeks",dark:true},
 {t:"Night Walks",c:"photography",tags:"#photography #film #city",h:420,bg:"radial-gradient(circle at 60% 40%,#ffb347 0 6%,transparent 7%),linear-gradient(180deg,#0d0d14,#1f1a2b 60%,#3b2a2a)"},
 {t:"Urban Fragments",c:"art",tags:"#illustration #urban #collage",h:380,bg:"radial-gradient(circle at 50% 50%,#ff9d3c 0 8%,transparent 9%),linear-gradient(180deg,#0e0a08,#2a1408 75%,#0e0a08)"},
 {t:"Accessible Forms Kit",c:"coding",tags:"#a11y #components #css",h:260,bg:"linear-gradient(135deg,#5b8cff,#7be0c3)",big:"AA+"},
 {t:"Reading List 2026",c:"personal",tags:"#books #reading #year",h:300,bg:"repeating-linear-gradient(90deg,#c7513a 0 22px,#e9a23b 22px 44px,#3b6e8f 44px 66px,#2f4a3a 66px 88px)"},
 {t:"Interview Synthesis",c:"research",tags:"#interviews #affinity-map #insights",h:340,bg:"radial-gradient(circle at 20% 25%,#ffe27a 0 9%,transparent 10%),radial-gradient(circle at 60% 40%,#ff9ab0 0 9%,transparent 10%),radial-gradient(circle at 35% 70%,#8fe0b0 0 9%,transparent 10%),radial-gradient(circle at 80% 75%,#9bc4ff 0 9%,transparent 10%),#f4efe6"}
];
var codeA='<b>const</b> board = <b>await</b> load();\n<b>for</b> (<b>const</b> s <b>of</b> board.signals) {\n  <b>if</b> (s.delta &gt; <i>0.2</i>) {\n    notify(s.name, s.delta);\n  }\n}\n<b>export</b> <b>default</b> board;';
var codeB='$ jt init my-tool\n<i>✔</i> created package.json\n<i>✔</i> added tests\n$ jt run --watch\n<i>listening…</i>';
var groups={work:['coding','research','design'],personal:['photography','art','personal']};
var grid=document.getElementById('grid'),mode='work',f='all';
items.forEach(function(it){
  var a=document.createElement('a');a.className='card';a.dataset.c=it.c;a.dataset.g=groups.personal.indexOf(it.c)>-1?'personal':'work';a.href='#';a.setAttribute('role','listitem');
  var inner=it.code?'<div class="code">'+(it.alt?codeB:codeA)+'</div>':(it.big?'<div class="big" style="'+(it.dark?'color:#1c2a52':'')+'">'+it.big+'</div>':'');
  a.innerHTML='<div class="art" style="height:'+it.h+'px;background:'+it.bg+'">'+inner+'</div><h3>'+it.t+'</h3><p>'+it.tags+'</p>';
  a.addEventListener('click',function(e){e.preventDefault()});
  grid.appendChild(a);
});
var fbox=document.getElementById('filters'),home=document.getElementById('home');
home.addEventListener('click',function(){f='all';apply()});
function apply(){
  fbox.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.f===f)});
  home.setAttribute('aria-pressed',f==='all');
  document.querySelectorAll('.card').forEach(function(c){c.classList.toggle('hide',c.dataset.g!==mode||(f!=='all'&&c.dataset.c!==f))});
}
function buildFilters(){
  fbox.innerHTML='';
  groups[mode].forEach(function(k){
    var b=document.createElement('button');b.dataset.f=k;b.textContent=k;b.setAttribute('aria-pressed',k===f);
    b.addEventListener('click',function(){f=(f===k?'all':k);apply()});
    fbox.appendChild(b);
  });
}
var mb=document.getElementById('mode');
function setMode(m){
  mode=m;f='all';document.body.dataset.mode=m;
  var l=m==='work'?'Switch to personal work':'Switch to professional work';
  mb.setAttribute('aria-label',l);mb.title=l;
  buildFilters();apply();
  try{localStorage.setItem('mode',m)}catch(e){}
}
mb.addEventListener('click',function(){setMode(mode==='work'?'personal':'work')});
var root=document.documentElement;
document.getElementById('theme').addEventListener('click',function(){
  var dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark';
  try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}
});
try{var s=localStorage.getItem('theme');if(s)root.dataset.theme=s}catch(e){}
var ab=document.getElementById('about'),pop=document.getElementById('pop');
function setPop(o){pop.hidden=!o;ab.setAttribute('aria-pressed',o);ab.setAttribute('aria-expanded',o)}
ab.addEventListener('click',function(){setPop(pop.hidden)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')setPop(false)});
document.addEventListener('click',function(e){if(!pop.hidden&&!pop.contains(e.target)&&!ab.contains(e.target))setPop(false)});
var sm='work';try{sm=localStorage.getItem('mode')||'work'}catch(e){}
setMode(sm==='personal'?'personal':'work');

</script>
</body>
</html>
