<script id="posts" type="application/json">{"sections":[{"id":"coding","group":"work"},{"id":"research","group":"work"},{"id":"design","group":"work"},{"id":"photography","group":"personal"},{"id":"art","group":"personal"},{"id":"personal","group":"personal"}],"posts":[{"slug":"mindbody-redesign","section":"design","title":"Mindbody Phone App Redesign","date":"2026-10-03","year":"2026","tags":["ux","usability","mobile-app","wellness","case-study"],"role":"Product designer (concept project)","tools":"Illustrator, Photoshop, After Effects, Figma","cover":"images/mindbody_1.png","label":"Book in 3 taps","labelColor":"#0d2f3a","height":420,"html":"\u003cp>\u003cem>Draft: delete the italic prompts as you fill each section in, then remove the line \u003ccode>draft: true\u003c/code> from the top of this file and run \u003ccode>node build.mjs\u003c/code>. This is an independent concept project and is not affiliated with Mindbody.\u003c/em>\u003c/p>\n\u003ch3>Overview\u003c/h3>\n\u003cp>\u003cem>One short paragraph: what the app is, that you redesigned the phone app, and the headline result. Example: &quot;I redesigned the Mindbody class-booking experience so first-time users can find and book a class in three taps instead of six.&quot;\u003c/em>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Role:\u003c/strong> product designer, solo concept project\u003c/li>\u003cli>\u003cstrong>Platform:\u003c/strong> phone app (mobile only)\u003c/li>\u003cli>\u003cstrong>Timeline:\u003c/strong> \u003cem>add weeks\u003c/em>\u003c/li>\u003cli>\u003cstrong>Focus:\u003c/strong> usability of booking, login and membership management on a phone\u003c/li>\u003cli>\u003cstrong>Tools:\u003c/strong> Illustrator, Photoshop, After Effects, Figma\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Scope:\u003c/strong> this project covers the Mindbody phone app for class-goers. It does not cover the website, tablet layouts or the studio-owner software.\u003c/p>\n\u003cp>\u003cstrong>User focus:\u003c/strong> I designed only from the class-goer's point of view. I did not have access to the studio-owner side, so I did not design or make claims about it. Business needs appear only as constraints.\u003c/p>\n\u003ch3>The problem\u003c/h3>\n\u003cp>\u003cem>Describe what is hard for users today, in plain language. Keep it to three or four sentences.\u003c/em>\u003c/p>\n\u003cp>Public reviews repeatedly mention confusing navigation, slow screens, login failures that interrupt booking, and trouble managing memberships and multiple accounts. For an app people use before a workout, every extra step or error is a reason to give up.\u003c/p>\n\u003cp>\u003cstrong>Problem statement:\u003c/strong> \u003cem>Write one sentence in the form &quot;People who want to ___ struggle to ___ because ___.&quot;\u003c/em>\u003c/p>\n\u003ch3>Goals\u003c/h3>\n\u003cul>\u003cli>Make the core task, finding and booking a class, fast and obvious.\u003c/li>\u003cli>Make sign-up and login reliable and forgiving.\u003c/li>\u003cli>Give people clear control over bookings and memberships.\u003c/li>\u003cli>Meet accessibility basics, including readable type and good contrast.\u003c/li>\u003c/ul>\n\u003cp>\u003cem>Add one measurable target for each goal, such as number of taps, time to complete, or task success rate.\u003c/em>\u003c/p>\n\u003ch3>Constraints and business context\u003c/h3>\n\u003cp>I designed for class-goers, but a real redesign has to work within business limits. These are the ones I kept in mind:\u003c/p>\n\u003cul>\u003cli>Studios set class capacity, pricing, waitlists and cancellation rules, so the app must display them clearly and cannot change them.\u003c/li>\u003cli>Reviews and a third-party summary report that Mindbody charges studios a commission on bookings made through its consumer marketplace, which affects how the app presents studio discovery. \u003ca href=\"https://vibefam.com/mindbody-review-pricing-features-pros-cons-2026/\">Source: Vibefam review\u003c/a> \u003cem>(verify against Mindbody's own pricing page before publishing)\u003c/em>\u003c/li>\u003cli>Payments, waivers and memberships involve legal and billing rules that I cannot see or change, so my designs show clarity and confirmation, not new policies.\u003c/li>\u003c/ul>\n\u003ch3>Research\u003c/h3>\n\u003ch4>What public reviews say\u003c/h4>\n\u003cp>I read recent public reviews of Mindbody on software-review sites and complaint boards (collected October 2026). Many reviewers are studio owners and staff, so I treated owner-written reviews as secondary evidence and used them only where the problem also affects class-goers, such as booking and login. I give more weight to consumer sources, and I label each source below. Reviews lean negative because unhappy people are more likely to write them, and some reviewers are very happy, so I treated these as leads to test in interviews and not as facts.\u003c/p>\n\u003cp>\u003cstrong>Theme 1: Booking feels complicated.\u003c/strong> Reviewers describe confusing scheduling and navigation, with one saying the app creates &quot;more friction than it solves&quot; for simple bookings like massages and sauna sessions. Others mention slow load times and a mobile experience that lacks the one-tap simplicity people expect today. Sources: Capterra, G2, Software Finder.\u003c/p>\n\u003cp>\u003cstrong>Theme 2: Login and app reliability.\u003c/strong> Users report being unable to log in, the app not recognizing their credentials during booking, and sign-up starting over each time. Operators also say clients struggle to log in, purchase and schedule. Source: Trustpilot reviews summarized by CheckThat.ai.\u003c/p>\n\u003cp>\u003cstrong>Theme 3: Missing features on mobile.\u003c/strong> Some reviewers say essential tasks still require a laptop, and one wishes the desktop experience matched the app. A software-review roundup also notes frequent glitches and slow, error-filled experiences in app store ratings. Sources: Software Advice, Capterra, The Salon Business.\u003c/p>\n\u003cp>\u003cstrong>Theme 4: Accounts and families.\u003c/strong> One consumer reported multiple accounts under their name, one meant for their child, and found the app hard to navigate with no help available. Source: Pissed Consumer.\u003c/p>\n\u003cp>\u003cstrong>Theme 5: Memberships, billing and cancellation.\u003c/strong> Reviewers report charges continuing after a failed cancellation, free classes leading to a paid membership, and rules that stop members from booking a class after a pause ends. Sources: Pissed Consumer, Software Finder.\u003c/p>\n\u003cp>\u003cstrong>Theme 6: Support is hard to reach.\u003c/strong> Several reviewers describe long waits, unresolved issues and phone numbers that do not work. This is outside the app's interface, but it raises the importance of clear in-app help and self-service. Sources: Pissed Consumer, Software Advice, Software Finder.\u003c/p>\n\u003cp>\u003cstrong>What people like.\u003c/strong> Reviewers praise the practitioner bios, the ratings shown before choosing a class, and an easy booking system with integrated payments. These strengths are worth keeping. Sources: Capterra.\u003c/p>\n\u003cp>\u003cstrong>What this means for the redesign:\u003c/strong> simplify the booking path, make login forgiving, give clear control over memberships and cancellation, and support booking for family members without a second account.\u003c/p>\n\u003cp>\u003cstrong>Sources\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"https://www.capterra.com/p/40229/MINDBODY/reviews/\">Mindbody reviews, Capterra\u003c/a> (mostly studio owners and staff, some members; early 2026)\u003c/li>\u003cli>\u003ca href=\"https://capterra.com/p/40229/MINDBODY/reviews/?page=3\">Mindbody reviews, Capterra page 3\u003c/a> (mostly studio owners and staff, some members; February 2026)\u003c/li>\u003cli>\u003ca href=\"https://www.g2.com/products/mindbody/reviews?qs=pros-and-cons\">Mindbody pros and cons, G2\u003c/a> (mostly business users; reviews through April 2026)\u003c/li>\u003cli>\u003ca href=\"https://www.softwareadvice.com/gymnastics/mindbody-profile/\">Mindbody reviews, Software Advice\u003c/a> (mostly business users)\u003c/li>\u003cli>\u003ca href=\"https://softwarefinder.com/retail/mindbody/reviews\">Mindbody reviews, Software Finder\u003c/a> (business users)\u003c/li>\u003cli>\u003ca href=\"https://thesalonbusiness.com/mindbody-software-review/\">The Ultimate Mindbody Software Review, The Salon Business\u003c/a> (industry reviewer, business-focused)\u003c/li>\u003cli>\u003ca href=\"https://mindbody.pissedconsumer.com/review.html\">Mindbody reviews, Pissed Consumer\u003c/a> (class-goers and consumers; 2026)\u003c/li>\u003cli>\u003ca href=\"https://checkthat.ai/brands/mindbody/reviews\">Mindbody reviews, CheckThat.ai\u003c/a> (summary of Trustpilot, G2 and Capterra; mixed owners and consumers)\u003c/li>\u003c/ul>\n\u003cp>\u003cem>Add the app store reviews and member threads you read yourself (for example from the App Store, Google Play or fitness communities), since consumer evidence matters most for this project.\u003c/em>\u003c/p>\n\u003cp>\u003cem>Add the date you checked each source, and re-check before publishing because reviews and the app change.\u003c/em>\u003c/p>\n\u003ch4>Audit of the current app\u003c/h4>\n\u003cp>\u003cem>Add annotated screenshots of the existing flows (images/mindbody-audit-1.jpg). Mark each usability problem with a number and list them below.\u003c/em>\u003c/p>\n\u003col>\u003cli>\u003cem>Problem you found, where it happens, and which heuristic it breaks\u003c/em>\u003c/li>\u003cli>\u003cem>...\u003c/em>\u003c/li>\u003cli>\u003cem>...\u003c/em>\u003c/li>\u003c/ol>\n\u003ch4>Heuristic review\u003c/h4>\n\u003cp>\u003cem>Score the app against the 10 usability heuristics (visibility of system status, error prevention, recognition over recall, and so on). Note the three weakest.\u003c/em>\u003c/p>\n\u003ch4>User interviews\u003c/h4>\n\u003cp>\u003cem>Number of participants, how you found them, and the tasks you asked them to attempt. Keep notes anonymous.\u003c/em>\u003c/p>\n\u003cblockquote>\u003cem>Add one short, powerful quote from a participant here.\u003c/em>\u003c/blockquote>\n\u003ch3>Insights\u003c/h3>\n\u003cp>\u003cem>Turn your research into three to five insights. Each one should lead to a design decision.\u003c/em>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Insight 1:\u003c/strong> \u003cem>what you learned\u003c/em>\u003c/li>\u003cli>\u003cstrong>Insight 2:\u003c/strong> \u003cem>what you learned\u003c/em>\u003c/li>\u003cli>\u003cstrong>Insight 3:\u003c/strong> \u003cem>what you learned\u003c/em>\u003c/li>\u003c/ul>\n\u003ch3>Design principles\u003c/h3>\n\u003cp>\u003cem>Choose three principles that guided every decision.\u003c/em>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Calm:\u003c/strong> \u003cem>what this means in the interface\u003c/em>\u003c/li>\u003cli>\u003cstrong>Clear:\u003c/strong> \u003cem>what this means in the interface\u003c/em>\u003c/li>\u003cli>\u003cstrong>Forgiving:\u003c/strong> \u003cem>what this means in the interface\u003c/em>\u003c/li>\u003c/ul>\n\u003ch3>Process\u003c/h3>\n\u003ch4>Sketches and flows\u003c/h4>\n\u003cp>\u003cem>Add photos or scans of your early sketches (images/mindbody-sketches.jpg) and a simple flow diagram of the new booking path.\u003c/em>\u003c/p>\n\u003ch4>Wireframes\u003c/h4>\n\u003cp>\u003cem>Add low-fidelity phone wireframes for each flow (use a standard phone frame such as 390 x 844 px) and explain the main decisions you made and what you rejected.\u003c/em>\u003c/p>\n\u003ch4>Visual system\u003c/h4>\n\u003cp>\u003cem>Show your color palette, type choices, spacing and key components such as buttons, class cards and form fields. Explain why they suit a wellness product.\u003c/em>\u003c/p>\n\u003ch3>The solution\u003c/h3>\n\u003ch4>1. Discover and book a class\u003c/h4>\n\u003cp>\u003cem>Before and after screens (images/mindbody-booking-before.jpg, images/mindbody-booking-after.jpg).\u003c/em>\u003c/p>\n\u003cp>\u003cem>What changed, why it is easier, and how many taps or steps you removed.\u003c/em>\u003c/p>\n\u003ch4>2. Sign up and log in\u003c/h4>\n\u003cp>\u003cem>Show clear error messages, easy password recovery and social sign-in options.\u003c/em>\u003c/p>\n\u003cp>\u003cem>Explain how the new flow prevents users from losing progress when something goes wrong.\u003c/em>\u003c/p>\n\u003ch4>3. Manage bookings and memberships\u003c/h4>\n\u003cp>\u003cem>Show upcoming classes, cancelling, rescheduling and pausing a membership, with clear confirmation of fees and dates before the user commits.\u003c/em>\u003c/p>\n\u003ch4>4. Family and multiple accounts\u003c/h4>\n\u003cp>\u003cem>Show how someone books for a child or partner without creating a second login.\u003c/em>\u003c/p>\n\u003ch4>Motion and feedback\u003c/h4>\n\u003cp>\u003cem>Describe the animated booking confirmation made in After Effects and what it communicates. Add a short video or GIF if you can.\u003c/em>\u003c/p>\n\u003ch3>Usability testing\u003c/h3>\n\u003cp>\u003cem>Test your prototype with five people. Describe the tasks, what you measured and what you changed afterward.\u003c/em>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Task 1:\u003c/strong> book a class for tomorrow morning. \u003cem>Result:\u003c/em> \u003cem>completion rate and time\u003c/em>\u003c/li>\u003cli>\u003cstrong>Task 2:\u003c/strong> cancel a booking. \u003cem>Result:\u003c/em> \u003cem>completion rate and time\u003c/em>\u003c/li>\u003cli>\u003cstrong>Task 3:\u003c/strong> pause a membership. \u003cem>Result:\u003c/em> \u003cem>completion rate and time\u003c/em>\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>What I changed after testing:\u003c/strong> \u003cem>list two or three improvements.\u003c/em>\u003c/p>\n\u003ch3>Accessibility\u003c/h3>\n\u003cp>\u003cem>Note contrast ratios, minimum text size, tap target size for thumbs, screen reader labels and support for larger system text.\u003c/em>\u003c/p>\n\u003ch3>Results\u003c/h3>\n\u003cp>\u003cem>Compare old and new using your own numbers.\u003c/em>\u003c/p>\n\u003cul>\u003cli>Booking steps: \u003cem>before\u003c/em> to \u003cem>after\u003c/em>\u003c/li>\u003cli>Task success rate: \u003cem>before\u003c/em> to \u003cem>after\u003c/em>\u003c/li>\u003cli>Average time to book: \u003cem>before\u003c/em> to \u003cem>after\u003c/em>\u003c/li>\u003c/ul>\n\u003ch3>Reflection\u003c/h3>\n\u003cp>\u003cem>What went well, what you would do differently, and what you learned about designing for usability. Two or three honest sentences are enough.\u003c/em>\u003c/p>\n\u003ch3>Next steps\u003c/h3>\n\u003cul>\u003cli>\u003cem>Test with a larger group.\u003c/em>\u003c/li>\u003cli>\u003cem>Adapt the design to other platforms: the other phone OS, tablet and a desktop browser.\u003c/em>\u003c/li>\u003cli>\u003cem>Design a version for first-time users.\u003c/em>\u003c/li>\u003c/ul>"},{"slug":"fog-season","section":"photography","title":"Oregon Coast","date":"2026-07-22","year":"2026","tags":["camera","coast"],"role":"Photographer","tools":"35mm film","cover":"images/oregon_1.JPG","label":"","labelColor":"","height":300,"html":"\u003cp>Road trip along oregon coast\u003c/p>"},{"slug":"chromatic-dreams","section":"art","title":"Chromatic Dreams","date":"2026-06-15","year":"2026","tags":["illustration","digital-art","abstract"],"role":"Artist","tools":"Blender, Procreate","cover":"radial-gradient(circle at 50% 45%,#f4b06a 0 22%,transparent 23%),linear-gradient(180deg,#3a1a6b,#d63a68 70%,#ff6a5a)","label":"","labelColor":"","height":460,"html":"\u003cp>A series of imagined planets over spiky alien landscapes, exploring how far saturated colour can go before it stops feeling natural.\u003c/p>"},{"slug":"reading-list-2026","section":"personal","title":"Reading List 2026","date":"2026-06-15","year":"2026","tags":["books","reading","year"],"role":"Reader","tools":"A notebook","cover":"repeating-linear-gradient(90deg,#c7513a 0 22px,#e9a23b 22px 4 thesis","date":"2024-06-15","year":"2024","tags":["interviews","affinity-map","insights"],"role":"Researcher","tools":"Miro, Dovetail","cover":"radial-gradient(circle at 20% 25%,#ffe27a 0 9%,transparent 10%),radial-gradient(circle at 60% 40%,#ff9ab0 0 9%,transparent 10%),radial-gradient(circle at 35% 70%,#8fe0b0 0 9%,transparent 10%),radial-gradient(circle at 80% 75%,#9bc4ff 0 9%,transparent 10%),#f4efe6","label":"","labelColor":"","height":340,"html":"\u003cp>Notes from 14 interviews turned into an affinity map and a short list of insights the team could act on.\u003c/p>"}]}</script>
<article id="detail" aria-live="polite"></article>
<canvas id="spark" aria-hidden="true"></canvas>
<script>
var DATA=JSON.parse(document.getElementById('posts').textContent);
var items=DATA.posts.map(function(p){return {t:p.title,c:p.section,tags:p.tags.map(function(x){return '#'+x}).join(' '),h:p.height,cover:p.cover,big:p.label,lc:p.labelColor,s:p.slug,html:p.html,year:p.year,role:p.role,tools:p.tools}});
var groups={work:[],personal:[]};
DATA.sections.forEach(function(x){if(DATA.posts.some(function(p){return p.section===x.id}))groups[x.group].push(x.id)});
var grid=document.getElementById('grid'),mode='work',f='all';
function slug(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function grp(it){return groups.personal.indexOf(it.c)>-1?'personal':'work'}
function qa(v){return String(v).replace(/"/g,'&quot;')}
function art(it,h){
  if(/\.(jpe?g|png|webp|gif|avif|svg)(\?.*)?$/i.test(it.cover))return '<div class="art im"><img src="'+qa(it.cover)+'" alt="" loading="lazy"></div>';
  var inner=it.big?'<div class="big" style="color:'+qa(it.lc||'#fff')+'"></div>':'';
  return '<div class="art" style="'+(h?'height:'+h+'px;':'')+'background:'+qa(it.cover)+'">'+inner+'</div>';
}
items.forEach(function(it){
  it.s=slug(it.t);
  var a=document.createElement('a');a.className='card';a.dataset.c=it.c;a.dataset.g=grp(it);a.href='#/'+it.s;
  a.innerHTML=art(it,it.h)+'<h3></h3><p></p>';
  a.querySelector('h3').textContent=it.t;a.querySelector('p').textContent=it.tags;
  var bg=a.querySelector('.big');if(bg)bg.textContent=it.big;
  grid.appendChild(a);
});
var fbox=document.getElementById('filters'),home=document.getElementById('home');
home.addEventListener('click',function(){f='all';apply()});
function apply(){
  fbox.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.f===f)});
  home.setAttribute('aria-pressed',f==='all');
  document.querySelectorAll('.card').forEach(function(c){c.classList.toggle('hide',c.dataset.g!==mode||(f!=='all'&&c.dataset.c!==f))});
}
function buildFilters(){
  fbox.innerHTML='';
  groups[mode].forEach(function(k){
    var b=document.createElement('button');b.dataset.f=k;b.textContent=k;b.setAttribute('aria-pressed',k===f);
    b.addEventListener('click',function(){f=(f===k?'all':k);apply()});
    fbox.appendChild(b);
  });
}
var mb=document.getElementById('mode');
function setMode(m){
  mode=m;f='all';document.body.dataset.mode=m;
  var l=m==='work'?'Switch to personal work':'Switch to professional work';
  mb.setAttribute('aria-label',l);mb.title=l;
  buildFilters();apply();
  try{localStorage.setItem('mode',m)}catch(e){}
}
mb.addEventListener('click',function(){setMode(mode==='work'?'personal':'work')});
var root=document.documentElement;
document.getElementById('theme').addEventListener('click',function(){
  var dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark';
  try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}
});
try{var s=localStorage.getItem('theme');if(s)root.dataset.theme=s}catch(e){}
var ab=document.getElementById('about'),pop=document.getElementById('pop');
function setPop(o){pop.hidden=!o;ab.setAttribute('aria-pressed',o);ab.setAttribute('aria-expanded',o)}
ab.addEventListener('click',function(){setPop(pop.hidden)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')setPop(false)});
document.addEventListener('click',function(e){if(!pop.hidden&&!pop.contains(e.target)&&!ab.contains(e.target))setPop(false)});
var sm='work';try{sm=localStorage.getItem('mode')||'work'}catch(e){}
setMode(sm==='personal'?'personal':'work');


var det=document.getElementById('detail'),saveY=0,wasDetail=false;
function route(){
  var m=location.hash.match(/^#\/(.+)/),it=null;
  if(m)items.forEach(function(x){if(x.s===m[1])it=x});
  if(!it){
    document.body.dataset.view='work';document.title='Ella Holl';
    if(wasDetail){scrollTo(0,saveY)}
    wasDetail=false;return;
  }
  if(!wasDetail)saveY=scrollY;
  wasDetail=true;
  if(grp(it)!==mode)setMode(grp(it));
  var list=items.filter(function(x){return grp(x)===grp(it)}),i=list.indexOf(it);
  var pv=list[(i+list.length-1)%list.length],nx=list[(i+1)%list.length];
  var meta='';[['Year',it.year],['Role',it.role],['Tools',it.tools]].forEach(function(m){if(m[1])meta+='<div><h4>'+m[0]+'</h4><p class="mv"></p></div>'});
  if(meta)meta='<div class="meta">'+meta+'</div>';
  det.innerHTML='<a class="back" href="#/"><span aria-hidden="true">←</span> Back</a><h1 tabindex="-1"></h1><p class="tags"></p>'+art(it,0)+
   meta+'<div class="desc prose">'+it.html+'</div>'+
   '<div class="pn"><a href="#/'+pv.s+'"><small>Previous</small><span class="pt"></span></a><a class="nx" href="#/'+nx.s+'"><small>Next</small><span class="nt"></span></a></div>';
  det.querySelector('h1').textContent=it.t;det.querySelector('.tags').textContent=it.tags;
  var vals=[it.year,it.role,it.tools].filter(Boolean);det.querySelectorAll('.mv').forEach(function(e,n){e.textContent=vals[n]});det.querySelector('.pt').textContent=pv.t;det.querySelector('.nt').textContent=nx.t;
  document.title=it.t+' – Ella Holl';
  document.body.dataset.view='detail';
  scrollTo(0,0);det.querySelector('h1').focus({preventScroll:true});
}
addEventListener('hashchange',route);
function leaveDetail(){if(location.hash.length>2)location.hash='#/'}
document.getElementById('home').addEventListener('click',leaveDetail);
document.getElementById('mode').addEventListener('click',leaveDetail);
route();

(function(){
  var rm=matchMedia('(prefers-reduced-motion:reduce)');
  var cv=document.getElementById('spark'),cx=cv.getContext('2d'),ps=[],run=false,hue=0,lx=-99,ly=-99,dpr=Math.min(devicePixelRatio||1,2);
  function size(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  function star(x,y,r){cx.beginPath();cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill()}
  function tick(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    ps=ps.filter(function(p){return p.l>0});
    ps.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.l-=.02;p.a+=.1;
      cx.globalAlpha=Math.max(p.l,0);cx.fillStyle='hsl('+p.h+',100%,62%)';
      star(p.x,p.y,p.s*(.6+.4*Math.sin(p.a)));
    });
    cx.globalAlpha=1;
    if(ps.length){requestAnimationFrame(tick)}else{run=false;cx.clearRect(0,0,innerWidth,innerHeight)}
  }
  addEventListener('pointermove',function(e){
    if(document.body.dataset.mode!=='personal'||rm.matches)return;
    var dx=e.clientX-lx,dy=e.clientY-ly;
    if(dx*dx+dy*dy<64)return;
    lx=e.clientX;ly=e.clientY;
    for(var i=0;i<2;i++){
      hue=(hue+14)%360;
      ps.push({x:lx+(Math.random()-.5)*8,y:ly+(Math.random()-.5)*8,vx:(Math.random()-.5)*1.6,vy:Math.random()*-1.2,l:1,h:hue,s:5+Math.random()*7,a:Math.random()*6});
    }
    if(ps.length>150)ps.splice(0,ps.length-150);
    if(!run){run=true;requestAnimationFrame(tick)}
  },{passive:true});
})();
</script>
